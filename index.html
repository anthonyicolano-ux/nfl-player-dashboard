<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Player Dashboard</title>

<style>
:root{
  --bg:#09101e;
  --panel:#111a2b;
  --panel2:#172238;
  --border:#283750;
  --text:#edf3fb;
  --muted:#94a3b8;
  --accent:#4ea1ff;
  --green:#3dd598;
  --yellow:#f5bd4f;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
header{
  padding:26px 30px 18px;border-bottom:1px solid var(--border);
}
h1{margin:0;font-size:28px}
.subtitle{color:var(--muted);margin-top:5px}
main{padding:20px 30px 40px}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.badge{
  padding:6px 10px;background:var(--panel);
  border:1px solid var(--border);border-radius:7px;
  color:var(--muted);font-size:12px
}
.good{color:var(--green)}
.cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:10px;margin-bottom:16px
}
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:14px
}
.card-label{
  color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.05em
}
.card-value{font-size:22px;font-weight:700;margin-top:5px}
.filters{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
  gap:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:12px;margin-bottom:14px
}
select,input{
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:6px;
  padding:9px;width:100%
}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.tab{
  background:var(--panel);border:1px solid var(--border);
  color:var(--muted);padding:8px 12px;border-radius:7px;
  cursor:pointer;white-space:nowrap
}
.tab.active{
  background:#173b67;border-color:var(--accent);color:white
}
.table-wrap{
  border:1px solid var(--border);border-radius:10px;
  overflow:auto;max-height:67vh;background:var(--panel)
}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead{position:sticky;top:0;z-index:2}
th{
  background:#162139;padding:9px;text-align:left;
  border-bottom:1px solid var(--border);
  cursor:pointer;white-space:nowrap
}
td{
  padding:8px 9px;border-bottom:1px solid #202c43;
  white-space:nowrap
}
tbody tr:hover{background:#16233b}
.player{font-weight:650}
.pos{color:var(--accent);font-weight:700}
.footer{
  display:flex;justify-content:space-between;gap:10px;
  margin-top:9px;color:var(--muted);font-size:12px
}
.loading{text-align:center;padding:50px;color:var(--muted)}
.error{color:#ff7373}
@media(max-width:700px){
  header,main{padding-left:12px;padding-right:12px}
}
</style>
</head>

<body>

<header>
<h1>NFL Player Data Dashboard</h1>
<div class="subtitle">
2026 usage • advanced statistics • fantasy production
</div>
</header>

<main>

<div id="status" class="status"></div>
<div id="cards" class="cards"></div>

<div class="filters">

<select id="range">
<option value="weekly">Weekly</option>
<option value="last3">Last 3 Weeks</option>
<option value="season">Season</option>
</select>

<select id="week">
<option value="">Latest / All</option>
</select>

<select id="position">
<option value="">All Positions</option>
<option>QB</option>
<option>RB</option>
<option>WR</option>
<option>TE</option>
</select>

<select id="team">
<option value="">All Teams</option>
</select>

<select id="opponent">
<option value="">All Opponents</option>
</select>

<input id="minSnaps" type="number" min="0" placeholder="Min snaps">

<input id="minTargets" type="number" min="0" placeholder="Min targets">

<input id="minCarries" type="number" min="0" placeholder="Min carries">

<input id="search" type="search" placeholder="Search player">

</div>

<div id="tabs" class="tabs"></div>

<div class="table-wrap">

<div id="loading" class="loading">Loading player data...</div>

<table id="table" style="display:none">
<thead><tr id="thead"></tr></thead>
<tbody id="tbody"></tbody>
</table>

</div>

<div class="footer">
<div id="count"></div>
<div>Source: nflverse • CC BY 4.0</div>
</div>

</main>

<script>

let RAW=[];
let STATUS={};
let activeView="Overview";
let sortColumn="fantasy_points_ppr";
let sortDirection=-1;

const COMMON=[
"player_display_name","position","recent_team","opponent"
];

const VIEWS={

Overview:[
...COMMON,"week","offense_snaps","offense_pct",
"carries","targets","receptions","touches","opportunities",
"fantasy_points_ppr"
],

QB:[
"player_display_name","recent_team","opponent","week",
"offense_snaps","completions","attempts","passing_yards",
"passing_tds","interceptions","passing_epa",
"adv_pass_times_pressured","adv_pass_times_pressured_pct",
"adv_pass_times_blitzed","adv_pass_times_hurried",
"adv_pass_times_hit","adv_pass_passing_bad_throws",
"adv_pass_passing_bad_throw_pct","fantasy_points_ppr"
],

RB:[
...COMMON,"week","offense_snaps","offense_pct",
"carries","rushing_yards","rushing_tds","targets","receptions",
"receiving_yards","touches","opportunities",
"adv_rush_rushing_yards_before_contact_avg",
"adv_rush_rushing_yards_after_contact_avg",
"adv_rush_rushing_broken_tackles","fantasy_points_ppr"
],

WR:[
...COMMON,"week","offense_snaps","offense_pct",
"targets","receptions","receiving_yards","receiving_tds",
"target_share","air_yards_share","wopr",
"receiving_yards_per_target","adv_rec_receiving_drop_pct",
"adv_rec_receiving_broken_tackles","fantasy_points_ppr"
],

TE:[
...COMMON,"week","offense_snaps","offense_pct",
"targets","receptions","receiving_yards","receiving_tds",
"target_share","air_yards_share","wopr",
"receiving_yards_per_target","adv_rec_receiving_drop_pct",
"fantasy_points_ppr"
],

"Playing Time":[
...COMMON,"week","offense_snaps","offense_pct",
"targets","targets_per_snap","carries","carries_per_snap"
],

Usage:[
...COMMON,"week","offense_snaps","carries","targets",
"receptions","touches","opportunities",
"target_share","air_yards_share","wopr"
],

Passing:[
"player_display_name","recent_team","opponent","week",
"completions","attempts","passing_yards","passing_tds",
"interceptions","passing_epa",
"adv_pass_times_sacked","adv_pass_times_blitzed",
"adv_pass_times_hurried","adv_pass_times_hit",
"adv_pass_times_pressured","adv_pass_times_pressured_pct",
"adv_pass_passing_bad_throws","adv_pass_passing_bad_throw_pct"
],

Rushing:[
...COMMON,"week","carries","rushing_yards","rushing_tds",
"rushing_first_downs","rushing_epa","rushing_yards_per_carry_calc",
"adv_rush_rushing_yards_before_contact",
"adv_rush_rushing_yards_before_contact_avg",
"adv_rush_rushing_yards_after_contact",
"adv_rush_rushing_yards_after_contact_avg",
"adv_rush_rushing_broken_tackles"
],

Receiving:[
...COMMON,"week","targets","receptions","receiving_yards",
"receiving_tds","receiving_first_downs","receiving_epa",
"catch_rate","receiving_yards_per_target",
"adv_rec_receiving_broken_tackles",
"adv_rec_receiving_drop","adv_rec_receiving_drop_pct",
"adv_rec_receiving_int","adv_rec_receiving_rat"
],

Fantasy:[
...COMMON,"week","offense_snaps","touches","opportunities",
"fantasy_points","fantasy_points_ppr",
"fantasy_points_per_snap","fantasy_points_per_100_snaps",
"ppr_points_per_snap","ppr_points_per_100_snaps"
]

};


function label(k){

const map={
player_display_name:"Player",
recent_team:"Team",
offense_snaps:"Snaps",
offense_pct:"Snap %",
fantasy_points:"FP",
fantasy_points_ppr:"PPR",
target_share:"Target Share",
air_yards_share:"Air Yard Share",
touches:"Touches",
opportunities:"Opportunities"
};

return map[k]||
k.replace(/^adv_pass_/,"Pass ")
.replace(/^adv_rush_/,"Rush ")
.replace(/^adv_rec_/,"Rec ")
.replaceAll("_"," ")
.replace(/\b\w/g,c=>c.toUpperCase());
}


function pctColumn(k){
return k.endsWith("_pct")||
k.includes("share")||
k==="catch_rate"||
k==="targets_per_snap"||
k==="carries_per_snap";
}


function fmt(k,v){

if(v===null||v===undefined||v==="")return "—";

if(pctColumn(k)&&!isNaN(Number(v)))
return (Number(v)*100).toFixed(1)+"%";

if(typeof v==="number"){
if(Number.isInteger(v))return v.toLocaleString();
return v.toFixed(2);
}

return v;
}


function populate(){

const teams=[...new Set(RAW.map(x=>x.recent_team).filter(Boolean))].sort();
const opps=[...new Set(RAW.map(x=>x.opponent).filter(Boolean))].sort();
const weeks=[...new Set(RAW.map(x=>x.week).filter(Boolean))].sort((a,b)=>a-b);

teams.forEach(x=>team.insertAdjacentHTML("beforeend",`<option>${x}</option>`));
opps.forEach(x=>opponent.insertAdjacentHTML("beforeend",`<option>${x}</option>`));
weeks.forEach(x=>week.insertAdjacentHTML("beforeend",`<option value="${x}">Week ${x}</option>`));
}


function baseFilter(){

const q=search.value.toLowerCase().trim();

return RAW.filter(r=>{

if(position.value&&r.position!==position.value)return false;
if(team.value&&r.recent_team!==team.value)return false;
if(opponent.value&&r.opponent!==opponent.value)return false;

if(q&&!String(r.player_display_name||"").toLowerCase().includes(q))
return false;

return true;
});
}


function aggregate(rows){

const map=new Map();

rows.forEach(r=>{

const key=r.player_id||r.player_display_name;

if(!map.has(key)){
map.set(key,{...r,week:"Aggregate"});
return;
}

const x=map.get(key);

Object.entries(r).forEach(([k,v])=>{

if(typeof v!=="number")return;
if(["season","week"].includes(k))return;

if(
k.endsWith("_pct")||
k.includes("share")||
k.includes("per_")||
k==="wopr"||
k==="racr"
)return;

x[k]=Number(x[k]||0)+v;

});
});

const result=[...map.values()];

result.forEach(x=>{

if(x.targets){
x.catch_rate=(x.receptions||0)/x.targets;
x.receiving_yards_per_target=(x.receiving_yards||0)/x.targets;
}

if(x.carries)
x.rushing_yards_per_carry_calc=(x.rushing_yards||0)/x.carries;

if(x.offense_snaps){

x.targets_per_snap=(x.targets||0)/x.offense_snaps;
x.carries_per_snap=(x.carries||0)/x.offense_snaps;

x.fantasy_points_per_snap=(x.fantasy_points||0)/x.offense_snaps;
x.fantasy_points_per_100_snaps=x.fantasy_points_per_snap*100;

x.ppr_points_per_snap=(x.fantasy_points_ppr||0)/x.offense_snaps;
x.ppr_points_per_100_snaps=x.ppr_points_per_snap*100;

}

});

return result;
}


function getRows(){

let rows=baseFilter();

const latest=STATUS.latest_week||Math.max(...RAW.map(x=>x.week));

if(range.value==="weekly"){

if(week.value)
rows=rows.filter(x=>String(x.week)===week.value);
else
rows=rows.filter(x=>Number(x.week)===Number(latest));

}

if(range.value==="last3"){

const start=Math.max(1,latest-2);
rows=rows.filter(x=>x.week>=start&&x.week<=latest);
rows=aggregate(rows);

}

if(range.value==="season")
rows=aggregate(rows);

const ms=Number(minSnaps.value||0);
const mt=Number(minTargets.value||0);
const mc=Number(minCarries.value||0);

rows=rows.filter(x=>
Number(x.offense_snaps||0)>=ms&&
Number(x.targets||0)>=mt&&
Number(x.carries||0)>=mc
);

return rows;
}


function createTabs(){

const names=[
"Overview","QB","RB","WR","TE",
"Playing Time","Usage","Passing",
"Rushing","Receiving","Fantasy","All Data"
];

tabs.innerHTML="";

names.forEach(name=>{

const b=document.createElement("button");
b.className="tab"+(name===activeView?" active":"");
b.textContent=name;

b.onclick=()=>{
activeView=name;

if(["QB","RB","WR","TE"].includes(name))
position.value=name;

createTabs();
render();
};

tabs.appendChild(b);

});
}


function render(){

let rows=getRows();

if(activeView==="Passing")
rows=rows.filter(x=>x.position==="QB");

if(activeView==="Rushing")
rows=rows.filter(x=>Number(x.carries||0)>0);

if(activeView==="Receiving")
rows=rows.filter(x=>Number(x.targets||0)>0);

let columns;

if(activeView==="All Data")
columns=[...new Set(RAW.flatMap(x=>Object.keys(x)))];
else
columns=VIEWS[activeView].filter(c=>RAW.some(r=>c in r));

rows.sort((a,b)=>{

const av=a[sortColumn],bv=b[sortColumn];

if(typeof av==="number"&&typeof bv==="number")
return(av-bv)*sortDirection;

return String(av??"").localeCompare(String(bv??""))*sortDirection;

});

thead.innerHTML="";

columns.forEach(c=>{

const th=document.createElement("th");
th.textContent=label(c);

th.onclick=()=>{

if(sortColumn===c)sortDirection*=-1;
else{
sortColumn=c;
sortDirection=-1;
}

render();
};

thead.appendChild(th);

});

tbody.innerHTML="";

rows.forEach(r=>{

const tr=document.createElement("tr");

columns.forEach(c=>{

const td=document.createElement("td");
td.textContent=fmt(c,r[c]);

if(c==="player_display_name")td.className="player";
if(c==="position")td.className="pos";

tr.appendChild(td);

});

tbody.appendChild(tr);

});

count.textContent=`${rows.length.toLocaleString()} players / records shown`;

loading.style.display="none";
table.style.display="table";
}


function header(){

const generated=STATUS.generated_at_utc
?new Date(STATUS.generated_at_utc).toLocaleString()
:"—";

status.innerHTML=`
<span class="badge good">✓ Validated</span>
<span class="badge">2026</span>
<span class="badge">Through Week ${STATUS.latest_week}</span>
<span class="badge">Updated ${generated}</span>
`;

cards.innerHTML=`

<div class="card">
<div class="card-label">Players</div>
<div class="card-value">${STATUS.unique_players}</div>
</div>

<div class="card">
<div class="card-label">Player-Weeks</div>
<div class="card-value">${STATUS.player_week_records.toLocaleString()}</div>
</div>

<div class="card">
<div class="card-label">Teams</div>
<div class="card-value">${STATUS.teams_found}/32</div>
</div>

<div class="card">
<div class="card-label">Snap Coverage</div>
<div class="card-value">${((STATUS.sources?.snap_counts?.coverage||0)*100).toFixed(1)}%</div>
</div>

`;

}


[
range,week,position,team,opponent,
minSnaps,minTargets,minCarries
].forEach(x=>x.addEventListener("change",render));

search.addEventListener("input",render);


async function start(){

try{

const [p,s]=await Promise.all([
fetch("data/players.json",{cache:"no-store"}),
fetch("data/data-status.json",{cache:"no-store"})
]);

if(!p.ok)throw new Error("players.json failed to load");
if(!s.ok)throw new Error("data-status.json failed to load");

RAW=await p.json();
STATUS=await s.json();

if(!Array.isArray(RAW)||!RAW.length)
throw new Error("Player dataset is empty");

header();
populate();
createTabs();
render();

}catch(e){

loading.innerHTML=
`<div class="error"><strong>Dashboard failed to load.</strong><br><br>${e.message}</div>`;

console.error(e);

}

}

start();

</script>

</body>
</html>
