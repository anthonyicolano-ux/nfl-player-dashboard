name: Update NFL Player Data

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 11:30 UTC.
    # We can adjust this after the first successful test.
    - cron: "30 11 * * *"

# The workflow can only modify contents in THIS repository.
permissions:
  contents: write

concurrency:
  group: nfl-player-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Retrieve and validate NFL data
        run: python scripts/update_nfl_data.py

      - name: Commit validated data
        run: |
          if git diff --quiet -- data/; then
            echo "No NFL data changes detected."
            exit 0
          fi

          git config user.name "nfl-dashboard-bot"
          git config user.email "nfl-dashboard-bot@users.noreply.github.com"

          git add data/
          git commit -m "Update NFL player data"
          git push
