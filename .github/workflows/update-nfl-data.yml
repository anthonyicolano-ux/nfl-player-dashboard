name: Update NFL Player Data

on:
  workflow_dispatch:

  schedule:
    # Runs daily at 11:30 UTC.
    - cron: "30 11 * * *"

# This workflow can only modify contents in this repository.
permissions:
  contents: write

concurrency:
  group: nfl-player-data-update
  cancel-in-progress: false

jobs:

  update-data:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      # ------------------------------------------------------
      # BUILD PLAYER DATA
      # ------------------------------------------------------

      - name: Retrieve and validate NFL player data
        run: |
          python scripts/update_nfl_data.py

      # ------------------------------------------------------
      # BUILD MATCHUP DATA
      # ------------------------------------------------------

      - name: Build defense vs position matchup data
        run: |
          python scripts/update_matchup_data.py

      # ------------------------------------------------------
      # VERIFY OUTPUT FILES EXIST
      # ------------------------------------------------------

      - name: Verify generated files
        run: |
          echo "Checking generated data files..."

          if [ ! -f "data/players.json" ]; then
            echo "ERROR: data/players.json was not created."
            exit 1
          fi

          if [ ! -f "data/data-status.json" ]; then
            echo "ERROR: data/data-status.json was not created."
            exit 1
          fi

          if [ ! -f "data/matchups.json" ]; then
            echo "ERROR: data/matchups.json was not created."
            exit 1
          fi

          echo "Generated files found:"
          ls -lh data/

      # ------------------------------------------------------
      # COMMIT GENERATED DATA
      # ------------------------------------------------------

      - name: Commit validated data
        run: |
          git config user.name "nfl-dashboard-bot"
          git config user.email "nfl-dashboard-bot@users.noreply.github.com"

          # Stage all validated generated data.
          git add data/

          echo "Git status after staging:"
          git status --short

          # Stop successfully if nothing changed.
          if git diff --cached --quiet; then
            echo "No NFL data changes detected."
            exit 0
          fi

          git commit -m "Update NFL player and matchup data"

          git push

          echo "NFL player and matchup data successfully committed and pushed."
